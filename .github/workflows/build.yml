name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifacts: |
              polynotes/target/release/bundle/deb/*.deb
              polynotes/target/release/bundle/appimage/*.AppImage

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifacts: |
              polynotes/target/release/bundle/msi/*.msi
              polynotes/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libclang-dev cmake pkg-config \
            libasound2-dev libjack-dev

      - name: Install LLVM/clang (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            core
            polynotes/src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        working-directory: polynotes
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: polynotes
        run: bun run build

      - name: Build Tauri app (release)
        working-directory: polynotes
        run: bun tauri build --ci
        env:
          MACOSX_DEPLOYMENT_TARGET: 11.0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polynotes-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14

  build-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libclang-dev cmake pkg-config \
            libasound2-dev libjack-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            core

      - name: Download whisper model for benchmark
        run: |
          mkdir -p core/whisper.cpp/models
          cd core/whisper.cpp/models
          bash download-ggml-model.sh tiny.en-q5_1

      - name: Build benchmark binary
        run: cargo build --release -p polynotes --bin benchmark

      - name: Upload benchmark binary
        uses: actions/upload-artifact@v4
        with:
          name: polynotes-benchmark-${{ github.sha }}
          path: polynotes/target/release/benchmark${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 14

